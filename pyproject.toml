[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "python-etl-utilities"
version = "0.1.0"
description = "Reusable Python utilities for ETL pipelines"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.31",
    "pandas>=2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0"
]

[tool.setuptools.packages.find]
where = ["src"]